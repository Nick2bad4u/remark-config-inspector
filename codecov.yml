# yaml-language-server: $schema=https://www.schemastore.org/codecov.json

codecov:
    branch: "main"
    max_report_age: "24h"
    notify:
        wait_for_ci: true
    require_ci_to_pass: true
    slug: "Nick2bad4u/remark-config-inspector"

bundle_analysis:
    warning_threshold: "5%"
    status: "informational"

comment:
    behavior: "default"
    layout: "header, diff, flags, files, footer"
    require_base: false
    require_changes: false
    require_head: true

component_management:
    default_rules:
        statuses:
            - target: "auto"
              threshold: "2%"
              type: "project"
    individual_components:
        - component_id: "cli_runtime"
          name: "CLI and static build runtime"
          paths:
              - "bin.mjs"
              - "src/build-static-html.ts"
              - "src/cli-options.ts"
              - "src/cli.ts"
              - "src/constants.ts"
              - "src/dirs.ts"
              - "src/errors.ts"

        - component_id: "remark_inspector"
          name: "Remark configuration inspection"
          paths:
              - "src/configs.ts"
              - "src/inspectors/**"
          statuses:
              - target: "auto"
                threshold: "2%"
                type: "project"
              - target: "80%"
                threshold: "3%"
                type: "patch"

        - component_id: "server_transport"
          name: "Server and WebSocket transport"
          paths:
              - "src/server.ts"
              - "src/ws.ts"

coverage:
    precision: 2
    range: "60...100"
    round: "down"
    status:
        patch:
            default:
                target: "80%"
                threshold: "2%"
        project:
            default:
                target: "auto"
                threshold: "2%"

flags:
    os-linux:
        carryforward: true
        paths:
            - "src/"

    os-macos:
        carryforward: true
        paths:
            - "src/"

    os-windows:
        carryforward: true
        paths:
            - "src/"

ignore:
    - "benchmarks/**"
    - "coverage/**"
    - "dist/**"
    - "docs/**"
    - "scripts/**"
    - "test/**"
    - "**/*.d.ts"
    - "**/*.test.*"
    - "**/*.spec.*"
